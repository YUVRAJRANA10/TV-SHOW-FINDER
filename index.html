<!DOCTYPE html>

<head>

    <title>TV Show Finder</title>

    <div class="header-container">
        <div class="logo-container">
            <div class="header-logo">
                <div class="logo-circle"></div>
                <div class="logo-text">
                    <span class="logo-tv">TV</span>
                    <span class="logo-show">SHOW</span>
                    <span class="logo-finder">FINDER</span>
                </div>
                <div class="logo-strip left-strip">
                    <div class="perf"></div>
                    <div class="perf"></div>
                    <div class="perf"></div>
                    <div class="perf"></div>
                    <div class="perf"></div>

                    <div class="perf"></div>
                    <div class="perf"></div>
                </div>
            </div>
        </div>
        <h1>Tv show Finder</h1>
    </div>
    <form id="searchform">
        <input id type="text" placeholder="Tv Show Title" name="query">
        <button>Search</button>
        <button type="button" id="voiceSearchButton">🎤</button>
        <div id="voiceSearchDialog" class="hidden">
            <div class="dialog-content">
                <p>Listening...</p>
            </div>
        </div>
    </form>
    
    <!-- Mood Selector Feature -->
    <div class="mood-selector-container">
        <h2 class="mood-title">SET YOUR MOOD FOR TODAY</h2>
        <div class="mood-buttons">
            <button class="mood-button" data-genre="action">ACTION</button>
            <button class="mood-button" data-genre="comedy">COMEDY</button>
            <button class="mood-button" data-genre="drama">DRAMA</button>
            <button class="mood-button" data-genre="sci-fi">SCI-FI</button>
            <button class="mood-button" data-genre="horror">HORROR</button>
            <button class="mood-button" data-genre="thriller">THRILLER</button>
            <button class="mood-button" data-genre="romance">ROMANCE</button>
            <button class="mood-button" data-genre="fantasy">FANTASY</button>
        </div>
    </div>
    
    <!-- 3D TV container with info text -->
    <div id="tv3d-container-wrapper">
        <div id="tv3d-container"></div>
        <div class="tv3d-info">
            <p>Click on elements to interact! The TV updates when you search for shows.</p>
        </div>
