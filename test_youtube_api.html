<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test YouTube API</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
</head>
<body>
    <h1>Test YouTube API</h1>
    <button id="fetchTrailerButton">Fetch Trailer</button>
    <div id="trailerContainer"></div>

    <script>
        const fetchTrailerButton = document.getElementById('fetchTrailerButton');
        const trailerContainer = document.getElementById('trailerContainer');

        const fetchTrailer = async (showName) => {
            try {
                const res = await axios.get(`https://www.googleapis.com/youtube/v3/search`, {
                    params: {
                        part: 'snippet',
                        q: `${showName} trailer`,
                        type: 'video',
                        key: 'AIzaSyBbTRzs818idOzniM3bZy_KIyUIkYf767Y' // Replace with your YouTube API key
                    }
                });
                console.log('YouTube API response:', res);
                const videoId = res.data.items[0].id.videoId;
                return `https://www.youtube.com/embed/${videoId}`;
            } catch (error) {
                console.error("Error fetching trailer:", error);
                console.error("Error details:", error.response ? error.response.data : error.message);
                return null;
            }
        };

        fetchTrailerButton.addEventListener('click', async () => {
            const trailerUrl = await fetchTrailer('Breaking Bad');
            if (trailerUrl) {
                trailerContainer.innerHTML = `
                    <iframe src="${trailerUrl}" width="560" height="315" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                `;
            } else {
                trailerContainer.innerHTML = '<p>Failed to fetch trailer.</p>';
            }
        });
    </script>
</body>
</html>
